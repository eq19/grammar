name: 'Docker Deploy Action'

description: >
  🪂  A Github Action to deploy pages conveniently

branding:
  icon: 'command'
  color: 'red'

inputs:
  id:
    description: The deploy id
    required: false
  hub_username:
    description: Username for Docker Hub
    default: ${{ github.actor }}       
    required: true
  hub_password:
    description: Docker Hub authentication token
    required: true
  hub_token:
    description: Docker Hub authentication token
    required: true
  action_path:
    description: Path to the dockerfile from which to build the image
    required: true
  credentials:
    description: 'The gcloud credentials'
    required: true
  image_name:
    description: Tag to use for the new image
    default: ${{ github.action_repository }}
    required: true
  dockerfile_path:
    description: Path to the dockerfile from which to build the image
    required: true
  initiate_pauli_sum:
    description: Build args
    required: false
    default: ""
  docker_hub_repo_short_description:
    description: Short description text for the docker hub repo
    required: true
  docker_hub_repo_readme_file_path:
    description: |
      Path of the md file which will be used as the docker hub repo readme
    required: true
  cache_src:
    description: Path for the docker cache source
    required: false
    default: /tmp/.buildx-cache
  cache_dest:
    description: Path for the docker cache destination
    required: false
    default: /tmp/.buildx-cache-new
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  repository:
    description: 'The deploy repository'
    default: ${{ github.repository }}
    required: false
  api_key:
    description: The key of api application
    required: true
  api_secret:
    description: The secret of api application
    required: true
  pypi_token:
    description: The pypi token
    required: true
  bot_token:
    description: The monitor token
    required: true
  logs_token:
    description: The warning token
    required: true
  chat_id:
    description: The telegram chat id
    required: true

outputs:
  artifact:
    description: Collect artifact outputs
    value: ${{ toJSON(steps.artifact.outputs.repo) }}
  set_output:
    description: Collect set_output outputs
    value: ${{ toJSON(steps.set_output.outputs) }}

runs:
  using: composite
  steps:
    - name: 💎 Set Artifact
      id: artifact
      shell: bash
      run: |      
        shopt -s dotglob
        rm -rf ${{ inputs.action_path }}/.git
        mv -f ${{ inputs.action_path }} ${{ github.workspace }}/_site
        mkdir -p ${{ inputs.action_path }} && cp -R ${{ github.workspace }}/_site/. ${{ inputs.action_path }}/
  
    - name: Setup Workspace
      shell: bash
      run: |
        echo "🧹 Free disk"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/lib/google-cloud-sdk
        docker system prune -af || true
        docker builder prune -af || true

        echo "⏫ Setting up 100GB tmpfs"
        sudo mkdir -p /mnt/extra
        sudo mount -t tmpfs -o size=100G tmpfs /mnt/extra
          
        echo "➡️ Syncing workspace"
        sudo rsync -a "$GITHUB_WORKSPACE/" /mnt/extra/

        echo "➡️ Switching workspace"
        echo "GITHUB_WORKSPACE=/mnt/extra" >> $GITHUB_ENV
        echo "GITHUB_WORKSPACE=/mnt/extra" >> $GITHUB_OUTPUT

        # optional symlink to avoid tool breakage
        sudo rm -rf "$GITHUB_WORKSPACE"
        sudo ln -s /mnt/extra "$GITHUB_WORKSPACE"

        echo "📌 Workspace successfully expanded." && df -h

    - uses: actions/setup-python@v6
      with:
        python-version: 3.11
        allow-prereleases: true

    - uses: actions/cache@v5
      if: runner.os == 'Redis'
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip

    - name: 💎 Set ID Token
      if:  ${{ env.REMOVE_RUNNER == 'false' }}
      uses: 'google-github-actions/auth@v3'
      id: 'auth'
      with:
        token_format: 'id_token'
        create_credentials_file: false
        credentials_json: ${{ inputs.credentials }}
        id_token_audience: 'https://us-central1-marketleader.cloudfunctions.net/function'

    - name: Install dependencies
      if: ${{ env.REMOVE_RUNNER == 'false' }}
      shell: bash
      env:
        BEARER: ${{ steps.auth.outputs.id_token }}
        APP_PATH: "user_data/ft_client/test_client/app.py"
        HYPEROPT_PARAM: "user_data/strategies/hyperopt_params.json"
        ARTIFACT: "user_data/ft_client/test_client/results/orgs.json"
      run: |
        python -m pip -q install --upgrade pip

        # Retry install TensorFlow
        for i in {1..20}; do
          python -m pip -qqq install "tensorflow-cpu==2.20.0" && break
          echo "TensorFlow install failed. retry $i..."
          sleep 5
        done

        # Retry install IREE packages
        for i in {1..20}; do
          python -m pip -q install --pre iree-base-compiler iree-base-runtime iree-tools-tf -f https://iree.dev/pip-release-links.html && break
          ##python ${{ inputs.action_path }}/pythonCode/testIREE.py   
          echo "IREE install failed. retry $i..."
          sleep 5
        done

        # Run your pipeline
        ##Ref: https://github.com/eq19/maps/tree/v3/pythonCode
        ##python ${{ github.workspace }}/.github/entrypoint/artifact/python/gellmann.py
        ##cd ${{ inputs.action_path }}/pythonCode && python npreader.py -h && python map.py -h
        bash user_data/ft_client/test_client/maps.sh $ID $JOBS_ID $APP_PATH ${DIR_PATH:-user_data} ${PARAM_NAME:-nil} $ARTIFACT $HYPEROPT_PARAM 

    - name: 🚀 Initiate Feed Container
      if: env.REMOVE_RUNNER == 'true'
      uses: devcontainers/ci@v0.3
      id: set_output
      with:
        imageTag: spin-${{ env.ID }}
        skipContainerUserIdUpdate: true
        imageName: ${{ inputs.image_name }}
        configFile: _site/.devcontainer.json
        #runCmd: bash user_data/ft_client/test_client/feed.sh
        push: ${{ env.REMOVE_RUNNER == 'true' && 'always' || 'never' }}
        env: |
          ID=${{ env.ID }}
          GH_TOKEN=${{ env.GH_TOKEN }}
          REMOTE_REPO=${{ inputs.repository }}
          REMOVE_RUNNER=${{ env.REMOVE_RUNNER }}
          BYPASS_LEXERING=${{ env.BYPASS_LEXERING }}
          TARGET_REPOSITORY=${{ env.TARGET_REPOSITORY }}
          
    - name: 🪂 Remove existing images
      if: env.REMOVE_RUNNER == 'true'
      id: variables
      shell: bash
      run: |
        BASE_NAME=$(basename ${{ inputs.image_name }})
        IFS=', '; array=($(curl -L -s 'https://registry.hub.docker.com/v2/repositories/${{ inputs.image_name }}/tags?page_size=1024' | jq -rc '."results"[]["name"]' | yq eval -P | sed "s/ /, /g")) 
        for ((i=0; i < ${#array[@]}; i++)); do
          if [[ "${array[$i]}" != "latest" ]]; then
            HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d "{\"username\": \"${{ inputs.hub_username }}\", \"password\": \"${{ inputs.hub_password }}\"}" https://hub.docker.com/v2/users/login/ | jq -r .token)
            curl -s -i -X DELETE -H "Accept: application/json" -H "Authorization: JWT $HUB_TOKEN" https://hub.docker.com/v2/namespaces/${{ inputs.hub_username }}/repositories/$BASE_NAME/tags/${array[$i]}
            echo "deleted: ${{ inputs.image_name }}:${array[$i]}"
          fi
        done

    - name: ⚧️ Rerun workflow if failed
      if: ${{ failure() && env.GITHUB_JOB == 'lexering' && env.SKIP_REMAINING_STEPS != 'true' }}
      shell: bash
      run: |
        gh workflow run "main.yml" --repo "$REPO_NAME" \
          --raw-field "RUN_MODE=$RUN_MODE" --raw-field "REMOVE_RUNNER=$REMOVE_RUNNER" \
          --raw-field "REDUCE_EPOCH=$REDUCE_EPOCH" --raw-field "BYPASS_LEXERING=$BYPASS_LEXERING"
