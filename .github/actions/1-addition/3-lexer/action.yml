name: 'Docker Deploy Action'

description: >
  🪂  A Github Action to deploy pages conveniently

branding:
  icon: 'command'
  color: 'green'

inputs:
  id:
    description: The deploy id
    required: false
  hub_username:
    description: Username for Docker Hub
    default: ${{ github.actor }}       
    required: true
  hub_password:
    description: Docker Hub authentication token
    required: true
  hub_token:
    description: Docker Hub authentication token
    required: true
  action_path:
    description: Path to the dockerfile from which to build the image
    required: true
  credentials:
    description: 'The gcloud credentials'
    required: true
  image_name:
    description: Tag to use for the new image
    default: ${{ github.action_repository }}
    required: true
  dockerfile_path:
    description: Path to the dockerfile from which to build the image
    required: true
  initiate_pauli_sum:
    description: Build args
    required: false
    default: ""
  docker_hub_repo_short_description:
    description: Short description text for the docker hub repo
    required: true
  docker_hub_repo_readme_file_path:
    description: |
      Path of the md file which will be used as the docker hub repo readme
    required: true
  cache_src:
    description: Path for the docker cache source
    required: false
    default: /tmp/.buildx-cache
  cache_dest:
    description: Path for the docker cache destination
    required: false
    default: /tmp/.buildx-cache-new
  provider:
    description: 'The deploy provider'
    required: true
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  repository:
    description: 'The deploy repository'
    default: ${{ github.repository }}
    required: false
  api_key:
    description: The key of api application
    required: true
  api_secret:
    description: The secret of api application
    required: true
  pypi_token:
    description: The pypi token
    required: true
  bot_token:
    description: The monitor token
    required: true
  live_token:
    description: The trading token
    required: true
  logs_token:
    description: The warning token
    required: true
  chat_id:
    description: The telegram chat id
    required: true

outputs:
  artifact:
    description: Collect artifact outputs
    value: ${{ toJSON(steps.artifact.outputs) }}
  variables:
    description: Collect variables outputs
    value: ${{ toJSON(steps.variables.outputs) }}

runs:
  using: composite
  steps:
    - name: 🪂 Adapt feed mapping
      if: env.GITHUB_JOB == 'lexering'
      shell: bash
      run: |
        gh variable set ORGS_JSON --body "$(cat $RUNNER_TEMP/orgs.json)"
        mv -f .github/entrypoint/dockerfile/* ${{ inputs.action_path }}/
        cd ${{ github.workspace }}/_site && rm -rf .git .devcontainer.json Dockerfile*
        #git clone --single-branch -b gh-pages ${REMOTE_REPO} ${{ inputs.action_path }}/_site &>/dev/null

        #cd ${{ inputs.action_path }}/_site
        #shopt -s dotglob && rm -rf ${RUNNER_TEMP}/*
        #[[ -d docs ]] && mv -f docs ${RUNNER_TEMP}/
        #[[ -d .sass-cache ]] && mv -f .sass-cache ${RUNNER_TEMP}/
        #[[ -f .jekyll-metadata ]] && mv -f .jekyll-metadata ${RUNNER_TEMP}/

        #rm -rf *
        #git rm -rfq .
        #git clean -fxd
        #mv -f ${RUNNER_TEMP}/* .   
        #mv -f ${{ github.workspace }}/_site/* .

        mv -f ${{ github.workspace }}/_site ${{ inputs.action_path }}/
        cat ${{ inputs.action_path }}/Dockerfile

    - uses: ikalnytskyi/action-setup-postgres@v8
      if: runner.os == 'Redis'
      id: postgres
      with:
        username: yoda
        password: GrandMaster
        database: jedi_order
        port: 34837
        postgres-version: "17"
        ssl: true

    - name: 🪂 Install Freqtrafe
      if: env.REMOVE_RUNNER == 'false'
      shell: bash
      env:
        VERSION: "2025.12"
      run: |
        cd user_data/build_helpers
        ./install_ta-lib.sh > /dev/null 2>&1 && rm -rf *.txt

        # Download requirement files from Freqtrade
        for f in requirements.txt requirements-dev.txt requirements-hyperopt.txt requirements-plot.txt requirements-freqai.txt requirements-freqai-rl.txt; do
          curl -fsSLO --retry 5 --retry-delay 2 \
          https://raw.githubusercontent.com/freqtrade/freqtrade/$VERSION/$f || true
        done

        pip install -qq --no-cache-dir -r ${{ github.workspace }}/user_data/build_helpers/requirements-plot.txt
        pip install -qq --no-cache-dir -r ${{ github.workspace }}/user_data/build_helpers/requirements-hyperopt.txt
        if [[ "$RUN_MODE" == "FreqAI" ]]; then
          pip install -qq --no-cache-dir -r ${{ github.workspace }}/user_data/build_helpers/requirements-freqai-rl.txt
          pip install -qq --no-cache-dir "torch==2.5.1" "torchvision==0.20.1" --force-reinstall
        fi
        pip install -qq --no-cache-dir ta "numpy<3.0" "aiodns<3.0" "freqtrade==$VERSION"

        if [[ "$GITHUB_JOB" == "lexering" ]]; then
          cd ${{ github.workspace }} && bash user_data/ft_client/test_client/feed.sh
        fi
   
    - name: 🪂 Upload downloaded data as artifact
      uses: actions/upload-artifact@v6
      if: ${{ env.REMOVE_RUNNER == 'false' && github.job == 'lexering' }}
      with:
        name: freqtrade-data
        path: user_data/data/

    - name: 🐎 Run Freqtrade
      if: ${{ env.REMOVE_RUNNER == 'false' && github.job == 'lexering' }}
      shell: bash
      env:
        CONNECTION_URI: ${{ steps.postgres.outputs.connection-uri }}
        SERVICE_NAME: ${{ steps.postgres.outputs.service-name }}
        CERTIFICATE_PATH: ${{ steps.postgres.outputs.certificate-path }}
        EXPECTED_CONNECTION_URI: postgresql://yoda:GrandMaster@localhost:34837/jedi_order?sslmode=verify-ca&sslrootcert=${{ steps.postgres.outputs.certificate-path }}
        EXPECTED_SERVICE_NAME: yoda
        EXPECTED_SERVER_VERSION: 17
        EXPECTED_SSL: true
      run: |
        bash user_data/ft_client/test_client/feed.sh $RUN_MODE
        ##cd /home/runner/work/_actions/eq19/eq19/v2/integrations/tensorflow
        ##pip install -e python_projects/* && iree-import-tflite -h && iree-import-tf -h

        ##cd /home/runner/work/_actions/eq19/eq19/v2/integrations/pjrt
        ##pip install -e ctstools python_packages/iree_cpu_plugin
  
        ##pip install -r requirements.txt && cd python_packages/iree_cpu_plugin/build/cmake && ninja
        ##JAX_PLATFORMS=iree-cpu pytest -n4 --max-worker-restart=9999 -p openxla_pjrt_artifacts --openxla-pjrt-artifact-dir=/tmp/foobar test/test_simple.py

        #cp ${{ github.workspace }}/.github/entrypoint/test.py . && python3 -m pytest -vv test.py
        #python ${{ github.workspace }}/web_programming/cc_exchanges.py

    - name: 🚀 Initiate Lexer
      uses: devcontainers/ci@v0.3
      if: runner.os == 'Redis'
      id: artifact
      with:
        imageTag: id-${{ env.ID }}
        skipContainerUserIdUpdate: true
        imageName: ${{ inputs.image_name }}
        runCmd: bash user_data/ft_client/test_client/lexer.sh
        configFile: ${{ inputs.action_path }}/.devcontainer.json
        push: ${{ env.REMOVE_RUNNER == 'true' && 'always' || 'never' }}
        env: |
          ID=${{ env.ID }}
          GH_TOKEN=${{ env.GH_TOKEN }}
          REMOTE_REPO=${{ env.REMOTE_REPO }}
          BEARER=${{ steps.auth.outputs.id_token }}
          TARGET_REPOSITORY=${{ env.TARGET_REPOSITORY }}

    - name: 💎 Delete Docker Images
      if: ${{ github.job == 'lexering' }}
      id: variables
      shell: bash
      env:
        id: ${{ inputs.id }}
        TARGET_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
      run: |        
        BASE_NAME=$(basename ${{ inputs.image_name }})
        echo 'output_${id}='${TARGET_REPOSITORY} >> ${GITHUB_OUTPUT}    
        IFS=', '; array=($(curl -L -s 'https://registry.hub.docker.com/v2/repositories/${{ inputs.image_name }}/tags?page_size=1024' | jq -rc '."results"[]["name"]' | yq eval -P | sed "s/ /, /g"))
        for ((i=0; i < ${#array[@]}; i++)); do
          if [ "${array[$i]}" != "latest" ]; then
            HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d "{\"username\": \"${{ inputs.hub_username }}\", \"password\": \"${{ inputs.hub_password }}\"}" https://hub.docker.com/v2/users/login/ | jq -r .token)
            curl -s -i -X DELETE -H "Accept: application/json" -H "Authorization: JWT $HUB_TOKEN" https://hub.docker.com/v2/namespaces/${{ inputs.hub_username }}/repositories/$BASE_NAME/tags/${array[$i]}
            echo "deleted: ${{ inputs.image_name }}:${array[$i]}"
          fi
        done

    - name: ⚧️ Rerun workflow if failed
      if: ${{ failure() && github.job == 'lexering' }}
      shell: bash
      run: |
        gh workflow run "main.yml" --repo "$REPO_NAME" \
          --raw-field "RUN_MODE=$RUN_MODE" --raw-field "REMOVE_RUNNER=$REMOVE_RUNNER" \
          --raw-field "REDUCE_EPOCH=$REDUCE_EPOCH" --raw-field "BYPASS_LEXERING=$BYPASS_LEXERING"
