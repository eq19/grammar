name: 'Jekyll Deploy Action'
description: >
  A Github Action to deploy the Jekyll site conveniently for GitHub Pages
inputs:
  provider:
    description: 'The deploy provider'
    required: true
  owner:
    description: 'The deploy owner'
    required: false
  token:
    description: 'The deploy token'
    required: false
  credentials:
    description: 'The gcloud credentials'
    required: true
  repository:
    description: 'The deploy repository'
    required: false
  failure_status:
    description: 'The deploy branch'
    required: false
  actor:
    description: 'The github username creating the commit'
    required: false
  gell_mann:
    description: 'The pre-build configuration'
    required: true
  id:
    description: The id according to os
    required: true

branding:
  icon: 'command'
  color: 'red'

outputs:
  all_outputs:
    description: Collect all outputs
    value: ${{ toJSON(steps.*.outputs) }}

runs:
  #using: 'node20'
  #main: '.github/run/main.js'
  #post: '.github/run/post.js'
  #post-if: 'success()'
  using: composite
  
  steps:
    - name: 🏗️ Collect output
      if: runner.os != 'macOS'
      uses: mathiasvr/command-output@v2.0.0
      id: command
      with:
        run: |
          date +'%Y-%m-%d'

    - name: ⏪ Rewind all jobs on failure
      if: inputs.failure_status == 'true'
      shell: bash
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

        #git config --global credential.helper store
        #git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        #echo "https://${GITHUB_ACTOR}:${GITHUB_ACCESS_TOKEN}@github.com" > ~/.git-credentials

        [[ -z "$GITHUB_ACCESS_TOKEN" ]] && GITHUB_ACCESS_TOKEN = ${{ inputs.token }}
        REMOTE_REPO="https://${GITHUB_ACTOR}:${GITHUB_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        git clone --single-branch --branch 'gh-pages' ${REMOTE_REPO} gh-pages && cd gh-pages
        git add . && git commit --allow-empty -m "rerun due to job failure" && git push
